name: Étude des grandes tendances

# Calcule l'étude pré-enregistrée (etudes/protocole_tendances.md) sur les vraies données de Yahoo Finance.
# Le rapport s'affiche dans le résumé de la tâche et dans son journal. Aucun secret n'est utilisé.
on:
  pull_request:
    paths:
      - "etudes/**"
      - ".github/workflows/etude_tendances.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  etude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Calculer l'étude et écrire le rapport
        run: python -m etudes.lancer_etude_tendances
